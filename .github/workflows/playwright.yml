name: Playwright Tests

# 与 ruoyi-fastapi-test/run_test.bat 同一套方案（见 ruoyi-fastapi-test/README.md）：
#   docker/compose.yml 只起 test-mysql(13307) / test-redis(16380) / test-nginx(18080)，
#   后端在 runner 本机以 --env=test 运行在 19099，nginx 把 /prod-api 转到 host.docker.internal:19099。
# 旧的 docker-compose.test.my.yml / docker-compose.test.pg.yml 全容器方案已删除，不再引用。
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  e2e-mysql:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build frontend dist (/prod-api)
        working-directory: ruoyi-fastapi-frontend
        run: |
          npm install --no-audit --no-fund
          npm run build:prod

      - name: Start test stack (MySQL / Redis / Nginx)
        working-directory: ruoyi-fastapi-test
        run: |
          docker compose -f docker/compose.yml down -v --remove-orphans
          docker compose -f docker/compose.yml up -d
          for i in $(seq 1 60); do
            if [ "$(docker inspect -f '{{.State.Health.Status}}' test-mysql)" = "healthy" ]; then
              echo "test-mysql healthy"; break
            fi
            sleep 3
          done

      - name: Install backend dependencies (incl. dist/pkg wheels)
        working-directory: ruoyi-fastapi-backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ../dist/pkg/telemetryparser-1.0.1-py3-none-any.whl ../dist/pkg/gpcan-1.0.5-py3-none-any.whl

      - name: Start backend (--env=test, port 19099)
        working-directory: ruoyi-fastapi-backend
        run: |
          nohup python app.py --env=test > ../backend-test.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:19099/captchaImage > /dev/null; then
              echo "backend ready"; exit 0
            fi
            sleep 3
          done
          echo "backend failed to start"; cat ../backend-test.log; exit 1

      - name: Run Playwright tests
        working-directory: ruoyi-fastapi-test
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium
          pytest -v

      - name: Backend log
        if: always()
        run: cat backend-test.log || true

      - name: Tear down test stack
        if: always()
        working-directory: ruoyi-fastapi-test
        run: docker compose -f docker/compose.yml down -v
