[pytest]
testpaths = scenarios
python_files = test_*.py
python_functions = test_*
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
addopts = -p no:cacheprovider -p no:playwright -ra
markers =
    unit: 本机自测（样本加载 / 协议组帧 / 模拟器应答），不碰网络和硬件
    ui_only: 只打开工控机页面（有头冒烟），不建连接、不下发指令
    hil_can: CAN 硬件在环（测试机 Alyst Pro ch0/ch1 <-> 工控机 ZLG ch0/ch1），需选被测设备 HIL_CAN_TARGET=biu|xl|yj216
    hil_serial: 串口硬件在环（测试机 COM9 <-> 工控机 COM8），需选被测设备 HIL_SERIAL_TARGET=<设备键>
    hil_udp: 地检板 UDP（工控机:66 <-> 测试机:99），需 HIL_UDP_ENABLE=1
